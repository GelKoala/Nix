[backdrop]
blur_intensity = 0.39999999105930328

[bar.main]
auto_hide = true
border = "on_primary"
center = [ "clock" ]
end = [ "group:g2" ]
font_weight = 400
margin_edge = 2
margin_ends = 150
padding = 16
position = "top"
radius = 15
radius_bottom_right = 15
reserve_space = false
scale = 1.2000000104308128
start = [ "group:g1" ]
thickness = 35

    [[bar.main.capsule_group]]
    border = "surface"
    fill = "outline"
    id = "g1"
    members = [ "workspaces", "audio_visualizer" ]
    opacity = 1.0
    padding = 9.0

    [[bar.main.capsule_group]]
    fill = "outline"
    id = "g2"
    members = [ "cpu", "power_profile", "output_volume", "wallpaper" ]
    opacity = 1.0
    padding = 6.0

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "clipboard"

[[control_center.shortcuts]]
type = "session"

[[control_center.shortcuts]]
type = "keyboard_layout"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = false

    [desktop_widgets.widget]

[idle]
pre_action_fade_seconds = 0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 1280.0
    cy = 957.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 0.0
    box_width = 0.0
    cx = 640.0
    cy = 677.0
    output = "winit"
    rotation = 0.0
    type = "login_box"

[shell]
corner_radius_scale = 0.90000001341104507
font_family = "Noto Music"
screen_time_enabled = true
settings_show_advanced = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    session_placement = "centered"

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "notify-send 'Noctalia' 'Custom session entry'"
    enabled = false
    variant = "default"

[theme]
builtin = "Kanagawa"
community_palette = "Mine"
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

[wallpaper]
directory = "/storage/Media"
enabled = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/storage/Media/road_rain_lamp_980734_2560x1080.jpg"

    [wallpaper.last]
    path = "/storage/Media/road_rain_lamp_980734_2560x1080.jpg"

    [wallpaper.monitors.winit]
    path = "/storage/Media/road_rain_lamp_980734_2560x1080.jpg"

[widget.audio_visualizer]
anchor = true
bands = 128
capsule_radius = 8
high_color = "on_surface"
mirrored = false
scale = 1.3500000000000001
width = 200.0

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.brightness]
scale = 0.80000000000000004
scroll_step = 11
show_label = false

[widget.clock]
capsule = false
capsule_border = "outline"
capsule_fill = "outline"
capsule_foreground = "outline"
capsule_padding = 4.0
capsule_radius = 19
color = "on_surface"
scale = 1.25

[widget.control-center]
glyph = "brand-walmart"
scale = 0.90000000000000002

[widget.cpu]
show_label = false
stat = "ram_used"

[widget.input_volume]
show_label = false

[widget.media]
art_size = 18.0
max_length = 260
min_length = 155
title_scroll = "on_hover"

[widget.output_volume]
capsule = false
capsule_border = "outline"
capsule_fill = "outline"
capsule_foreground = "outline"
font_weight = 400
scale = 1.0
scroll_step = 4
show_label = false

[widget.power_profile]
scale = 1.0

[widget.session]
color = "on_surface_variant"
scale = 0.90000000000000002

[widget.spacer_2]
length = 50
type = "spacer"

[widget.spacer_3]
length = 5
type = "spacer"

[widget.spacer_4]
length = 10
type = "spacer"

[widget.weather]
max_length = 157
scale = 0.90000000000000002
show_condition = false

[widget.workspaces]
capsule_fill = "outline"
capsule_opacity = 0.59999999999999998
capsule_padding = 14.0
capsule_radius = 10
display = "none"
empty_color = "shadow"
focused_color = "on_surface"
occupied_color = "shadow"
scale = 0.90000000000000013
